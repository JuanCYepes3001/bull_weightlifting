version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint (vía eslint-config-next) aún no soporta TS 7
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
